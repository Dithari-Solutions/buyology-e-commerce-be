# ─── App-tier compose (Web-app-1 / Web-app-2) ─────────────────────────────────
# Runs ONLY the Spring Boot app. All stateful services are external, shared, and
# reached over WireGuard:
#   Postgres + Elasticsearch  -> db-server     10.10.0.4
#   Redis + RabbitMQ          -> redis-server  10.10.0.5
# Each replica binds 8080 to its OWN WireGuard IP (WG_BIND_IP) so the port is
# never public; HAProxy on the Conf server load-balances across both over WG.
name: buyology-ecommerce-be

services:
  app:
    image: ${DOCKER_USERNAME}/ecommerce-app:${IMAGE_TAG:-latest}
    container_name: ecommerce-app
    restart: always
    dns: ["8.8.8.8", "1.1.1.1"]
    ports:
      - "${WG_BIND_IP}:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # ── Postgres (db-server over WG) ──
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.10.0.4:5432/buyology_production
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # First empty-DB boot only: set to `update` (one node), then back to `validate`.
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}

      # ── Redis (redis-server over WG, AUTH required) ──
      REDIS_HOST: "10.10.0.5"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # ── Elasticsearch (db-server over WG) ──
      SPRING_ELASTICSEARCH_URIS: "http://10.10.0.4:9200"

      # ── RabbitMQ (redis-server over WG) ──
      RABBITMQ_HOST: "10.10.0.5"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"
      SPRING_RABBITMQ_HOST: "10.10.0.5"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: "/"

      # ── Auth / security ──
      JWT_SECRET: ${JWT_SECRET}
      # How long a session survives without renewal, and how long it can be renewed for. An admin
      # entering products works for hours, and every access-token expiry is a chance for the session
      # to END rather than renew, so the access window is deliberately wide. Levers, not code:
      # shortening the access token is the way to make a revoked role bite sooner.
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-30}
      # Seconds a just-rotated refresh token is still honoured, so a client racing itself (or retrying
      # on a slow connection) is not mistaken for a replay and signed out. 0 = strict single use.
      JWT_REFRESH_REUSE_GRACE_SECONDS: ${JWT_REFRESH_REUSE_GRACE_SECONDS:-120}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: "true"

      # ── App config ──
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEB_BASE_URL: ${WEB_BASE_URL}
      # Rate-limit bypass key for trusted server clients (n8n product integration).
      RATE_LIMIT_BYPASS_KEY: ${RATE_LIMIT_BYPASS_KEY:-}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-false}
      # Per-minute cap for ONE admin on /api/admin/** (0 = built-in 300). Bump if admins see 429s.
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-0}
      # Both of these are budgets for the WHOLE PLATFORM while TRUST_FORWARDED_HEADERS is false,
      # because every tier except ADMIN is keyed on the proxy's IP. 0 = the built-in ceiling
      # (1200/min refresh, 100/min public). These are the levers to raise during an incident
      # without waiting for a release — a throttled refresh shows up as people being signed out.
      AUTH_REFRESH_RATE_LIMIT_PER_MINUTE: ${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:-0}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-0}
      # false 500s every endpoint that reads a lazy association while assembling its response.
      # Here so recovering is a restart rather than a deploy.
      SPRING_JPA_OPEN_IN_VIEW: ${SPRING_JPA_OPEN_IN_VIEW:-true}

      # ── Cash on delivery ──
      # Goods leave before the money arrives, so every COD order is an unsecured advance of stock.
      # Empty COD_COUNTRIES means EVERY market; COD_MAX_ORDER_AED 0 means NO ceiling.
      COD_ENABLED: ${COD_ENABLED:-false}
      COD_COUNTRIES: ${COD_COUNTRIES:-}
      COD_MAX_ORDER_AED: ${COD_MAX_ORDER_AED:-0}

      # ── Stock ──
      # Whether the LEGACY products.stock_quantity column may refuse an order. Leave false: it is an
      # urgency hint that has been counting down past whatever an admin typed since V12 and has never
      # had units returned, so a product that merely sold well reads 0 and enforcing it refuses
      # checkout on the best-selling catalogue. Audit and backfill that column before touching this.
      #
      # products.available_quantity (V55) is the number that actually limits orders and needs no flag,
      # because it is null — "not tracked", no ceiling — until somebody states a figure.
      ENFORCE_PRODUCT_STOCK: ${ENFORCE_PRODUCT_STOCK:-false}

      # ── VAT ──
      # Catalogue prices INCLUDE this. Nothing is added at checkout — the rate is used to work out how
      # much of a total already IS tax, for the "VAT 5% included" line and the invoice.
      #
      # So do NOT set this to 0 to avoid double-charging: nothing is charged twice, and 0 instead blanks
      # the VAT figure everywhere and stops orders recording the rate they were taxed at. (Earlier
      # comments here said the opposite; they belonged to the version that added the tax on top.)
      VAT_RATE_PERCENT: ${VAT_RATE_PERCENT:-5}
      VAT_COUNTRIES: ${VAT_COUNTRIES:-}

      # ── Email / OTP (SendGrid) ──
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@buyology.online}

      # ── OAuth ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI}

      # ── Paymob ──
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://uae.paymob.com}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET}
      PAYMOB_NOTIFICATION_URL: ${PAYMOB_NOTIFICATION_URL}
      PAYMOB_REDIRECTION_URL: ${PAYMOB_REDIRECTION_URL}
      PAYMOB_CARD_INTEGRATION_ID: ${PAYMOB_CARD_INTEGRATION_ID}
      PAYMOB_CARD_IFRAME_ID: ${PAYMOB_CARD_IFRAME_ID}
      PAYMOB_TABBY_INTEGRATION_ID: ${PAYMOB_TABBY_INTEGRATION_ID}
      PAYMOB_TAMARA_INTEGRATION_ID: ${PAYMOB_TAMARA_INTEGRATION_ID}

      # ── Quiqup delivery (STAGING test module; inert unless QUIQUP_ENABLED=true) ──
      QUIQUP_ENABLED: ${QUIQUP_ENABLED:-false}
      QUIQUP_BASE_URL: ${QUIQUP_BASE_URL:-https://api.staging.quiqup.com}
      QUIQUP_AUTH_MODE: ${QUIQUP_AUTH_MODE:-apikey}
      QUIQUP_API_KEY: ${QUIQUP_API_KEY:-}
      QUIQUP_API_KEY_HEADER: ${QUIQUP_API_KEY_HEADER:-Authorization}
      QUIQUP_API_KEY_PREFIX: ${QUIQUP_API_KEY_PREFIX:-Bearer}
      QUIQUP_ACCOUNT_ID: ${QUIQUP_ACCOUNT_ID:-}
      QUIQUP_WEBHOOK_SECRET: ${QUIQUP_WEBHOOK_SECRET:-}
      # Flip to true only after a delivery has been seen with a valid signature.
      QUIQUP_WEBHOOK_REQUIRE_SIGNATURE: ${QUIQUP_WEBHOOK_REQUIRE_SIGNATURE:-false}
      QUIQUP_WEBHOOK_TOKEN: ${QUIQUP_WEBHOOK_TOKEN:-}
      QUIQUP_WEBHOOK_TOKEN_HEADER: ${QUIQUP_WEBHOOK_TOKEN_HEADER:-X-Buyology-Webhook-Token}
      QUIQUP_ALLOW_PRODUCTION_WRITES: ${QUIQUP_ALLOW_PRODUCTION_WRITES:-false}
      QUIQUP_TIMEOUT_MS: ${QUIQUP_TIMEOUT_MS:-20000}
      QUIQUP_CONNECT_TIMEOUT_MS: ${QUIQUP_CONNECT_TIMEOUT_MS:-5000}
      # ── Quiqup automatic dispatch (paid order -> real courier; independent of QUIQUP_ENABLED) ──
      QUIQUP_DISPATCH_ENABLED: ${QUIQUP_DISPATCH_ENABLED:-false}
      # Quiqup's payment_mode value for a CASH job. Inferred, not confirmed — if it is wrong the
      # courier is never asked for the money. Correct it here with a restart.
      QUIQUP_COD_PAYMENT_MODE: ${QUIQUP_COD_PAYMENT_MODE:-cod}
      QUIQUP_DISPATCH_KIND: ${QUIQUP_DISPATCH_KIND:-partner_next_day}
      QUIQUP_DISPATCH_AUTO_READY: ${QUIQUP_DISPATCH_AUTO_READY:-false}
      QUIQUP_DISPATCH_RETRY_AFTER_MINUTES: ${QUIQUP_DISPATCH_RETRY_AFTER_MINUTES:-10}
      QUIQUP_DISPATCH_MAX_ATTEMPTS: ${QUIQUP_DISPATCH_MAX_ATTEMPTS:-5}
      QUIQUP_DISPATCH_RETRY_HORIZON_HOURS: ${QUIQUP_DISPATCH_RETRY_HORIZON_HOURS:-48}
      QUIQUP_DISPATCH_RETRY_INTERVAL_MS: ${QUIQUP_DISPATCH_RETRY_INTERVAL_MS:-300000}
      # ── Cancelling a dispatched Quiqup job ──
      # These five were exported by the deploy but never declared here, so compose dropped them and the
      # container never saw any of them — they were unsettable in production. That matters most for
      # QUIQUP_CANCEL_ENABLED, which defaults to TRUE: cancel was on and could not be turned off, so the
      # incident lever (stop calling their cancel API) did nothing. The others are the retry envelope for
      # a cancellation that Quiqup has not confirmed stopped, which is what holds a customer's refund
      # back — so being unable to tune them is being unable to respond.
      QUIQUP_CANCEL_ENABLED: ${QUIQUP_CANCEL_ENABLED:-true}
      QUIQUP_CANCEL_STRICT_CUSTOMER_PREFLIGHT: ${QUIQUP_CANCEL_STRICT_CUSTOMER_PREFLIGHT:-true}
      QUIQUP_CANCEL_MAX_ATTEMPTS: ${QUIQUP_CANCEL_MAX_ATTEMPTS:-5}
      QUIQUP_CANCEL_DEADLINE_MINUTES: ${QUIQUP_CANCEL_DEADLINE_MINUTES:-120}
      QUIQUP_CANCEL_RETRY_INTERVAL_MS: ${QUIQUP_CANCEL_RETRY_INTERVAL_MS:-60000}
      # ── ERPNext (Frappe) integration (TESTING; read-only, inert unless ERPNEXT_ENABLED=true) ──
      ERPNEXT_ENABLED: ${ERPNEXT_ENABLED:-false}
      ERPNEXT_BASE_URL: ${ERPNEXT_BASE_URL:-}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      # Order push (PAID order → ERPNext Sales Order + Sales Invoice)
      ERPNEXT_SYNC_ORDERS: ${ERPNEXT_SYNC_ORDERS:-true}
      ERPNEXT_SUBMIT_DOCUMENTS: ${ERPNEXT_SUBMIT_DOCUMENTS:-true}
      ERPNEXT_COMPANY: ${ERPNEXT_COMPANY:-}
      ERPNEXT_AUTO_CREATE_CUSTOMER: ${ERPNEXT_AUTO_CREATE_CUSTOMER:-true}
      ERPNEXT_AUTO_CREATE_ITEMS: ${ERPNEXT_AUTO_CREATE_ITEMS:-true}
      ERPNEXT_DEFAULT_ITEM_GROUP: ${ERPNEXT_DEFAULT_ITEM_GROUP:-Products}
      ERPNEXT_DEFAULT_UOM: ${ERPNEXT_DEFAULT_UOM:-Nos}
      ERPNEXT_CUSTOMER_GROUP: ${ERPNEXT_CUSTOMER_GROUP:-All Customer Groups}
      ERPNEXT_TERRITORY: ${ERPNEXT_TERRITORY:-All Territories}
      ERPNEXT_SHIPPING_ACCOUNT_HEAD: ${ERPNEXT_SHIPPING_ACCOUNT_HEAD:-}
      ERPNEXT_DEFAULT_WAREHOUSE: ${ERPNEXT_DEFAULT_WAREHOUSE:-}

      # ── Claude API (AI repair price estimate + sell/trade-in valuation) ──
      # A blank ANTHROPIC_API_KEY disables both estimates; the repair and sell flows
      # still work, just without an AI suggestion.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      REPAIR_AI_ESTIMATE_ENABLED: ${REPAIR_AI_ESTIMATE_ENABLED:-true}
      REPAIR_PRICING_PATH: ${REPAIR_PRICING_PATH:-}
      SELL_AI_ESTIMATE_ENABLED: ${SELL_AI_ESTIMATE_ENABLED:-true}
      SELL_PRICING_PATH: ${SELL_PRICING_PATH:-}

      # ── Storefront AI assistant (public customer-support chatbot) ──
      # Shares ANTHROPIC_API_KEY above. ASSISTANT_ENABLED=false turns the widget off without a
      # code deploy — it is the only public endpoint that costs money per request, so that lever
      # has to be reachable here. The message/conversation caps are what bound the daily spend;
      # the per-IP rate limit only bounds a burst.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-45}
      ASSISTANT_MAX_MESSAGES_PER_CONVERSATION: ${ASSISTANT_MAX_MESSAGES_PER_CONVERSATION:-40}
      ASSISTANT_MAX_CONVERSATIONS_PER_VISITOR_PER_DAY: ${ASSISTANT_MAX_CONVERSATIONS_PER_VISITOR_PER_DAY:-20}
      # Mount an edited assistant-knowledge.md and point here to correct a policy answer without
      # rebuilding the jar. Blank = the copy bundled in the image.
      ASSISTANT_KNOWLEDGE_PATH: ${ASSISTANT_KNOWLEDGE_PATH:-}

      # ── Delivery pricing (AED) ──
      DELIVERY_FREE_SHIPPING_THRESHOLD_AED: ${DELIVERY_FREE_SHIPPING_THRESHOLD_AED:-100.00}
      # ONE delivery rate for every method and every market, below the free-shipping threshold above.
      # Pickup stays free. Tiered pricing was how the cart's quote and the order's charge drifted apart.
      DELIVERY_FLAT_FEE_AED: ${DELIVERY_FLAT_FEE_AED:-25.00}
      # Whether 30-minute delivery may be offered at all. Off — enforced server-side, because hiding the
      # button in the clients closes nothing (a client can post the method, and the payment webhook
      # takes it from metadata the client wrote).
      DELIVERY_EXPRESS_ENABLED: ${DELIVERY_EXPRESS_ENABLED:-false}
      # RETIRED — all three are read by nothing. Delivery is the single DELIVERY_FLAT_FEE_AED above,
      # for every method and every market, so raising any of these changes no price. Kept only so an
      # environment still exporting them does not look broken; delete once nothing does.
      DELIVERY_EXPRESS_FEE_AED: ${DELIVERY_EXPRESS_FEE_AED:-20.00}
      DELIVERY_QUIQUP_FEE_AED: ${DELIVERY_QUIQUP_FEE_AED:-15.00}
      DELIVERY_STANDARD_FEE_AED: ${DELIVERY_STANDARD_FEE_AED:-15.00}
      # Still live, but for DISPATCH not pricing: which countries an order may be handed to Quiqup in.
      DELIVERY_QUIQUP_COUNTRIES: ${DELIVERY_QUIQUP_COUNTRIES:-UAE}

      # ── Website visitor analytics (storefront page-view beacon) ──
      # ANALYTICS_ENABLED=false makes the public beacon a no-op without a code deploy; it is
      # the only lever on the one unauthenticated write endpoint, so it has to be reachable here.
      # ANALYTICS_IP_SALT blank stores no IP-derived value at all — set a long random string to
      # make a flood of fake beacons traceable to one source.
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-400}
      ANALYTICS_METRICS_CACHE_SECONDS: ${ANALYTICS_METRICS_CACHE_SECONDS:-30}
      ANALYTICS_ACTIVE_WINDOW_MINUTES: ${ANALYTICS_ACTIVE_WINDOW_MINUTES:-5}
      ANALYTICS_IP_SALT: ${ANALYTICS_IP_SALT:-}

      # ── Twilio (phone OTP) ──
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}

      # ── Contabo S3 ──
      CONTABO_S3_ENDPOINT: ${CONTABO_S3_ENDPOINT}
      CONTABO_S3_ACCESS_KEY: ${CONTABO_S3_ACCESS_KEY}
      CONTABO_S3_SECRET_KEY: ${CONTABO_S3_SECRET_KEY}
      CONTABO_S3_BUCKET_NAME: ${CONTABO_S3_BUCKET_NAME}
      CONTABO_S3_PUBLIC_URL: ${CONTABO_S3_PUBLIC_URL}
      # Optional: unset means images keep being served straight from the object store.
      CONTABO_CDN_URL: ${CONTABO_CDN_URL:-}

      # ── Courier service integration ──
      COURIER_SERVICE_PRIVATE_KEY: ${COURIER_SERVICE_PRIVATE_KEY}

      # ── Firebase / FCM ──
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
    volumes:
      - /opt/buyology/firebase/service-account.json:/firebase/service-account.json:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
