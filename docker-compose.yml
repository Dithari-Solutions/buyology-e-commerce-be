name: buyology-ecommerce-be

services:

  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    image: ${DOCKER_USERNAME}/ecommerce-app:${IMAGE_TAG:-latest}
    container_name: ecommerce-app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Hybrid Flyway adoption: stamp the existing (non-empty) schema at baseline
      # version 0 instead of failing on first run. Not a secret — a plain config flag.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEB_BASE_URL: ${WEB_BASE_URL}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COOKIE_SECURE: "true"
      PAYMOB_API_KEY: ${PAYMOB_API_KEY}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET}
      PAYMOB_NOTIFICATION_URL: ${PAYMOB_NOTIFICATION_URL}
      PAYMOB_REDIRECTION_URL: ${PAYMOB_REDIRECTION_URL}
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://uae.paymob.com}
      PAYMOB_CARD_INTEGRATION_ID: ${PAYMOB_CARD_INTEGRATION_ID}
      PAYMOB_CARD_IFRAME_ID: ${PAYMOB_CARD_IFRAME_ID}
      PAYMOB_TABBY_INTEGRATION_ID: ${PAYMOB_TABBY_INTEGRATION_ID}
      PAYMOB_TAMARA_INTEGRATION_ID: ${PAYMOB_TAMARA_INTEGRATION_ID}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      FIREBASE_ENABLED: "true"
      COURIER_SERVICE_PRIVATE_KEY: ${COURIER_SERVICE_PRIVATE_KEY}
      CONTABO_S3_ENDPOINT: ${CONTABO_S3_ENDPOINT}
      CONTABO_S3_ACCESS_KEY: ${CONTABO_S3_ACCESS_KEY}
      CONTABO_S3_SECRET_KEY: ${CONTABO_S3_SECRET_KEY}
      CONTABO_S3_BUCKET_NAME: ${CONTABO_S3_BUCKET_NAME}
      CONTABO_S3_PUBLIC_URL: ${CONTABO_S3_PUBLIC_URL}
      RABBITMQ_HOST: buyology-rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"
      SPRING_RABBITMQ_HOST: buyology-rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: "/"
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    volumes:
      - /opt/buyology/firebase/service-account.json:/firebase/service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-network
      - buyology-shared
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  ecommerce-network:
    driver: bridge
  buyology-shared:
    external: true

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
