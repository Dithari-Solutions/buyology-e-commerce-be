# ─── Production profile ───────────────────────────────────────────────────────
# All values are injected via environment variables at runtime.
# Never commit real secrets — use GitHub Actions secrets or a .env file.

# -----------------------------
# PostgreSQL datasource
# -----------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate / JPA
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------
# Logging (quieter in production)
# -----------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# -----------------------------
# Redis (rate limiting via Bucket4j)
# -----------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-minutes=15
jwt.refresh-token-validity-days=7

# -----------------------------
# Cookie settings
# -----------------------------
cookie.secure=${COOKIE_SECURE:true}

# -----------------------------
# Google OAuth2
# -----------------------------
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

# -----------------------------
# Twilio SendGrid (email)
# -----------------------------
twilio.sendgrid.api-key=${SENDGRID_API_KEY}
twilio.sendgrid.from-email=${SENDGRID_FROM_EMAIL:firdovsirz@gmail.com}
twilio.sendgrid.from-name=Buyology

# -----------------------------
# OTP settings
# -----------------------------
otp.expiry-minutes=10
otp.resend-cooldown-seconds=60

# -----------------------------
# Multipart file upload
# -----------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=100MB

# -----------------------------
# Swagger UI
# -----------------------------
springdoc.swagger-ui.path=/swagger-ui.html
