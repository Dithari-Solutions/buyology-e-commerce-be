# ─── Production profile ───────────────────────────────────────────────────────
# All values are injected via environment variables at runtime.
# Never commit real secrets — use GitHub Actions secrets or a .env file.

# -----------------------------
# PostgreSQL datasource
# -----------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate / JPA
# -----------------------------
# Prod default is `validate`: Hibernate must NOT mutate the live schema (auto-DDL in
# prod risks silent drift / data loss and races across nodes). Schema changes go
# through Flyway migrations under db/migration.
# FIRST-TIME setup against an EMPTY database only: deploy once with
# HIBERNATE_DDL_AUTO=update to let Hibernate create the tables, then remove the
# override so subsequent boots validate against the entities.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Batch-load lazy associations with IN clauses instead of one query per parent.
# Major N+1 mitigation for list endpoints (products, orders, etc.) with no code change.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# -----------------------------
# Flyway — hybrid adoption. baseline-on-migrate stamps the existing (non-empty)
# prod schema at the baseline version instead of failing on first run.
# Repeated here (not only in application.properties) so the prod profile always
# has it, regardless of how config is layered at runtime.
# -----------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=existing schema (managed by hibernate ddl-auto)
spring.flyway.locations=classpath:db/migration

# -----------------------------
# Logging (quieter in production)
# -----------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# Structured (JSON/ECS) console logs for aggregation (Spring Boot 3.4 native).
logging.structured.format.console=ecs

# -----------------------------
# Redis (rate limiting via Bucket4j)
# -----------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis AUTH password. Prod Redis requires a password; empty default keeps local
# (no-auth) dev working. Wired from the REDIS_PASSWORD env var / CI secret.
spring.data.redis.password=${REDIS_PASSWORD:}

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-minutes=15
jwt.refresh-token-validity-days=7

# -----------------------------
# Two-factor authentication (TOTP / Google Authenticator)
# Set a dedicated MFA_SECRET_ENCRYPTION_KEY in prod (>= 32 chars). Rotating it
# invalidates every enrolled authenticator, so keep it stable and backed up.
# -----------------------------
# Master switch for mandatory 2FA. Temporarily OFF everywhere so API clients
# (n8n) can authenticate without a TOTP step. Set MFA_ENABLED=true to re-enable.
mfa.enabled=${MFA_ENABLED:false}
mfa.issuer=${MFA_ISSUER:Buyology Admin}
mfa.secret-encryption-key=${MFA_SECRET_ENCRYPTION_KEY:${JWT_SECRET}}

# -----------------------------
# Image watermarking (Buyology logo stamped on catalog/marketing images).
# Applies to products/, banners/, stories/, news/ images. Disable per-env with
# WATERMARK_ENABLED=false.
# -----------------------------
watermark.enabled=${WATERMARK_ENABLED:true}
watermark.opacity=${WATERMARK_OPACITY:0.55}
watermark.scale=${WATERMARK_SCALE:0.20}
watermark.margin=${WATERMARK_MARGIN:0.03}

# -----------------------------
# CORS allowed origins (comma-separated, no spaces)
# Set via env var CORS_ALLOWED_ORIGINS in CI/CD
# -----------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# -----------------------------
# First-admin bootstrap. Admin self-registration requires an existing admin, so a
# fresh DB needs one seeded SUPERADMIN. Set BOTH env vars once on first deploy, then
# unset/rotate. No-op if blank or if the account already exists.
# -----------------------------
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# -----------------------------
# Public website base URL (used in outbound email links — e.g. B2B setup link)
# Set via env var WEB_BASE_URL in CI/CD. Defaults to the live storefront so
# B2B / membership email links open the real site even if the secret is missing.
# -----------------------------
app.web-base-url=${WEB_BASE_URL:https://buyology.online}
app.dashboard-base-url=${DASHBOARD_BASE_URL:https://admin.buyology.online}
app.base-url=${APP_BASE_URL:https://buyology.online}

# -----------------------------
# Cookie settings
# -----------------------------
cookie.secure=${COOKIE_SECURE:true}

# -----------------------------
# OAuth2
# -----------------------------
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

apple.team-id=${APPLE_TEAM_ID}
apple.client-id=${APPLE_CLIENT_ID}
apple.key-id=${APPLE_KEY_ID}
apple.private-key=${APPLE_PRIVATE_KEY}
apple.redirect-uri=${APPLE_REDIRECT_URI}

# -----------------------------
# Paymob
# -----------------------------
paymob.base-url=${PAYMOB_BASE_URL:https://uae.paymob.com}
paymob.notification-url=${PAYMOB_NOTIFICATION_URL}
paymob.redirection-url=${PAYMOB_REDIRECTION_URL}
paymob.secret-key=${PAYMOB_SECRET_KEY}
paymob.public-key=${PAYMOB_PUBLIC_KEY}
paymob.hmac-secret=${PAYMOB_HMAC_SECRET}
paymob.card.integration-id=${PAYMOB_CARD_INTEGRATION_ID}
paymob.card.iframe-id=${PAYMOB_CARD_IFRAME_ID}
paymob.tabby.integration-id=${PAYMOB_TABBY_INTEGRATION_ID}
paymob.tamara.integration-id=${PAYMOB_TAMARA_INTEGRATION_ID}

# -----------------------------
# Quiqup delivery (STAGING test module)
# -----------------------------
# Ships INERT: leave QUIQUP_ENABLED unset/false and every admin action returns 409
# and webhooks are ignored. To test, set QUIQUP_ENABLED=true and QUIQUP_API_KEY in
# the environment. Base URL stays on Quiqup STAGING until a real integration is
# signed off (prod would be https://api-ae.quiqup.com). Decoupled from orders.
quiqup.enabled=${QUIQUP_ENABLED:false}
quiqup.base-url=${QUIQUP_BASE_URL:https://api.staging.quiqup.com}
quiqup.auth-mode=${QUIQUP_AUTH_MODE:apikey}
quiqup.api-key=${QUIQUP_API_KEY:}
quiqup.api-key-header=${QUIQUP_API_KEY_HEADER:Authorization}
quiqup.api-key-prefix=${QUIQUP_API_KEY_PREFIX:Bearer}
quiqup.account-id=${QUIQUP_ACCOUNT_ID:}
quiqup.webhook-secret=${QUIQUP_WEBHOOK_SECRET:}
# Shared secret we ask Quiqup to echo in a custom header on every delivery (set it on the
# subscription's "custom headers" field). Independent of the HMAC above: their signing scheme is
# undocumented, this one we control. Observe-only for now — logged, never used to reject.
quiqup.webhook-token=${QUIQUP_WEBHOOK_TOKEN:}
quiqup.webhook-token-header=${QUIQUP_WEBHOOK_TOKEN_HEADER:X-Buyology-Webhook-Token}
# Quiqup issues no self-serve sandbox key, so the credential on the account is a live one and
# production is one variable away. Writes (create / ready-for-collection / cancel) are refused
# whenever the base URL is not staging, unless this is ALSO true. Reads are never blocked.
quiqup.allow-production-writes=${QUIQUP_ALLOW_PRODUCTION_WRITES:false}
# Response timeout (time to a reply once connected) and TCP connect timeout. Connect is kept much
# shorter so an unreachable host fails fast and distinguishably from a merely slow one.
quiqup.timeout-ms=${QUIQUP_TIMEOUT_MS:20000}
quiqup.connect-timeout-ms=${QUIQUP_CONNECT_TIMEOUT_MS:5000}

# -----------------------------
# ERPNext (Frappe) integration — TESTING stage
# -----------------------------
# Read-only: relays the ERPNext Item list to the admin dashboard; nothing persisted.
# Ships INERT: leave ERPNEXT_ENABLED unset/false and the admin endpoints return 409.
# To test, set ERPNEXT_ENABLED=true plus ERPNEXT_BASE_URL / ERPNEXT_API_KEY /
# ERPNEXT_API_SECRET. Frappe token auth (Authorization: token <key>:<secret>).
erpnext.enabled=${ERPNEXT_ENABLED:false}
erpnext.base-url=${ERPNEXT_BASE_URL:}
erpnext.api-key=${ERPNEXT_API_KEY:}
erpnext.api-secret=${ERPNEXT_API_SECRET:}
# Order push: on PAID, create a Sales Order + Sales Invoice in ERPNext. Runs async and
# never affects the order/payment flow; failures are recorded on orders.erp_sync_error.
# Set ERPNEXT_SUBMIT_DOCUMENTS=false to leave both as drafts for review in ERPNext.
# ERPNEXT_SHIPPING_ACCOUNT_HEAD is company-specific (e.g. "Freight and Forwarding Charges - B");
# when blank, shipping is omitted and ERPNext totals cover goods only.
erpnext.sync-orders=${ERPNEXT_SYNC_ORDERS:true}
erpnext.submit-documents=${ERPNEXT_SUBMIT_DOCUMENTS:true}
erpnext.company=${ERPNEXT_COMPANY:}
erpnext.auto-create-customer=${ERPNEXT_AUTO_CREATE_CUSTOMER:true}
erpnext.auto-create-items=${ERPNEXT_AUTO_CREATE_ITEMS:true}
erpnext.default-item-group=${ERPNEXT_DEFAULT_ITEM_GROUP:Products}
erpnext.default-uom=${ERPNEXT_DEFAULT_UOM:Nos}
erpnext.customer-group=${ERPNEXT_CUSTOMER_GROUP:All Customer Groups}
erpnext.territory=${ERPNEXT_TERRITORY:All Territories}
erpnext.shipping-account-head=${ERPNEXT_SHIPPING_ACCOUNT_HEAD:}
# Warehouse for the SO/SI line items — REQUIRED for the order push (ERP items are stock items,
# ERPNext demands a warehouse). Must be a LEAF warehouse of ERPNEXT_COMPANY, e.g. "FG Warehouse - DTL".
erpnext.default-warehouse=${ERPNEXT_DEFAULT_WAREHOUSE:}

# -----------------------------
# Twilio SendGrid (email)
# -----------------------------
twilio.sendgrid.api-key=${SENDGRID_API_KEY:}
twilio.sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@buyology.online}
twilio.sendgrid.from-name=${SENDGRID_FROM_NAME:Buyology}

# -----------------------------
# OTP settings
# -----------------------------
otp.expiry-minutes=10
otp.resend-cooldown-seconds=60

# -----------------------------
# Rate limiting (Bucket4j)
# -----------------------------
# Trusted server-to-server clients (e.g. the n8n product integration) can bypass
# throttling by sending header `X-Service-Key: <RATE_LIMIT_BYPASS_KEY>`. JWT auth
# on the endpoint still applies. Leave blank to disable the bypass.
app.rate-limit.bypass-key=${RATE_LIMIT_BYPASS_KEY:}
# Trust X-Forwarded-For for the per-client rate-limit key. Safe ONLY behind a
# trusted proxy that overwrites XFF with the real client IP (see note). When
# false, all requests via nginx share one bucket per tier (the conf-server IP).
# NOTE: the ADMIN tier no longer depends on this — its bucket is keyed on the
# authenticated admin, so admins get their own budget either way. Every other
# tier (PUBLIC, AUTH_*, ANALYTICS_BEACON) is still IP-keyed and therefore still
# collapses to one shared bucket while this is false.
app.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
# Per-minute ceiling for one admin on /api/admin/**. Blank/0 uses the built-in 300.
# The dashboard's real appetite is high: its shell idles at ~10 req/min per open tab
# (Procurement + Repair badge counts and the notification bell on 30s timers) and each
# page load fires several calls in parallel, which is why the old 30/min returned 429s
# during normal use. Raise this here rather than in code if admins hit the ceiling again.
app.rate-limit.admin-per-minute=${ADMIN_RATE_LIMIT_PER_MINUTE:0}

# -----------------------------
# Multipart file upload — bounded to prevent memory/disk exhaustion (DoS)
# -----------------------------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:250MB}
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=${MAX_REQUEST_SIZE:250MB}

# -----------------------------
# Courier service proxy
# -----------------------------
courier.service.url=${COURIER_SERVICE_URL:https://api-courier.buyology.online}
courier.service.timeout-ms=${COURIER_SERVICE_TIMEOUT_MS:5000}
courier.service.jwt.private-key=${COURIER_SERVICE_PRIVATE_KEY}
courier.service.jwt.issuer=buyology-ecommerce-service
courier.service.jwt.expiry-seconds=${COURIER_SERVICE_JWT_EXPIRY:60}

# -----------------------------
# Actuator — health probes + Prometheus metrics scrape endpoint.
# /actuator/health is public (LB/k8s probes); /actuator/prometheus is permitted in
# SecurityConfig but exposes only low-sensitivity operational metrics (JVM, pool,
# templated HTTP routes — no PII/secrets). Restrict it at the network layer in prod.
# -----------------------------
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=ecommerce-backend

# -----------------------------
# Swagger UI — disabled in production (do not expose the full API surface)
# -----------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# -----------------------------
# Error responses — never leak internals to clients
# -----------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# -----------------------------
# Contabo S3 (Object Storage)
# -----------------------------
contabo.s3.endpoint=${CONTABO_S3_ENDPOINT}
contabo.s3.access-key=${CONTABO_S3_ACCESS_KEY}
contabo.s3.secret-key=${CONTABO_S3_SECRET_KEY}
contabo.s3.bucket-name=${CONTABO_S3_BUCKET_NAME}
contabo.s3.public-url=${CONTABO_S3_PUBLIC_URL}

# -----------------------------
# Elasticsearch
# -----------------------------
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}

# -----------------------------
# Firebase / FCM push notifications
# -----------------------------
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-key=file:${FIREBASE_KEY_PATH:/firebase/service-account.json}

# -----------------------------
# RBAC
# -----------------------------
# Keep false until every admin holds a role that covers their job (check the Roles & Permissions page),
# then flip to true so roles genuinely restrict access. See RbacPolicy.
rbac.strict-permissions=${RBAC_STRICT_PERMISSIONS:false}

# -----------------------------
# Website visitor analytics
# -----------------------------
# First-party page-view counting: the storefront beacon (POST /api/analytics/visit) feeds the
# unique-visitor / total-visit metric on the dashboard home page. Independent of the GA4 tag on
# buyology.online, which is unaffected.
# Kill switch — false makes the beacon a no-op (it still answers 202) while the dashboard keeps
# reading whatever was already recorded. Flip it if write volume ever becomes a problem.
app.analytics.enabled=${ANALYTICS_ENABLED:true}
# site_visits is the only table that grows with traffic rather than with business events, so rows are
# trimmed nightly past this age. Counts for trimmed days are gone for good — keep this comfortably
# longer than the widest window the dashboard shows.
app.analytics.retention-days=${ANALYTICS_RETENTION_DAYS:400}
# How long a computed metrics payload is reused, so repeated dashboard refreshes do not re-run the
# COUNT(DISTINCT …) aggregate. 0 disables caching.
app.analytics.metrics-cache-seconds=${ANALYTICS_METRICS_CACHE_SECONDS:30}
# Window behind the "active now" figure on the traffic card.
app.analytics.active-window-minutes=${ANALYTICS_ACTIVE_WINDOW_MINUTES:5}
# Salt for the stored IP digest, used only to trace a flood of fake beacons back to one source.
# Blank (the default) stores no IP-derived value at all — an unsalted hash of an IPv4 address is
# trivially reversible, so it would be personal data dressed up as a hash. Set a long random string.
app.analytics.ip-salt=${ANALYTICS_IP_SALT:}

# -----------------------------
# Claude API — AI repair price estimation & sell (trade-in) valuation
# -----------------------------
# Blank ANTHROPIC_API_KEY disables both features (the repair and sell flows work
# exactly as before, just without an AI suggestion). Both are produced in AED for
# the UAE market and converted for display via CurrencyExchangeService.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-4-8}
repair.ai-estimate.enabled=${REPAIR_AI_ESTIMATE_ENABLED:true}
# The AI prices strictly from the company price list. It ships bundled
# (repair-pricing.json); set this to an external JSON file to update prices without
# rebuilding the jar (mount the file into the container and point here). Blank = bundled.
repair.pricing.path=${REPAIR_PRICING_PATH:}

sell.ai-estimate.enabled=${SELL_AI_ESTIMATE_ENABLED:true}
# Trade-ins have no fixed price sheet, so this file carries the buy-back POLICY the
# model applies on top of its market estimate (margin, condition/age multipliers,
# category floors, defect deductions, hard rules). Ships bundled (sell-pricing.json);
# point this at an external JSON file to tune margins without rebuilding the jar.
sell.pricing.path=${SELL_PRICING_PATH:}
