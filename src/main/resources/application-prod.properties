# ─── Production profile ───────────────────────────────────────────────────────
# All values are injected via environment variables at runtime.
# Never commit real secrets — use GitHub Actions secrets or a .env file.

# -----------------------------
# PostgreSQL datasource
# -----------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate / JPA
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------
# Logging (quieter in production)
# -----------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# -----------------------------
# Redis (rate limiting via Bucket4j)
# -----------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-minutes=15
jwt.refresh-token-validity-days=7

# -----------------------------
# Cookie settings
# -----------------------------
cookie.secure=${COOKIE_SECURE:true}

# -----------------------------
# OAuth2
# -----------------------------
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

apple.team-id=${APPLE_TEAM_ID}
apple.client-id=${APPLE_CLIENT_ID}
apple.key-id=${APPLE_KEY_ID}
apple.private-key=${APPLE_PRIVATE_KEY}
apple.redirect-uri=${APPLE_REDIRECT_URI}

# -----------------------------
# Paymob
# -----------------------------
paymob.base-url=${PAYMOB_BASE_URL:https://uae.paymob.com}
paymob.notification-url=${PAYMOB_NOTIFICATION_URL}
paymob.redirection-url=${PAYMOB_REDIRECTION_URL}
paymob.secret-key=${PAYMOB_SECRET_KEY}
paymob.public-key=${PAYMOB_PUBLIC_KEY}
paymob.hmac-secret=${PAYMOB_HMAC_SECRET}
paymob.card.integration-id=${PAYMOB_CARD_INTEGRATION_ID}
paymob.card.iframe-id=${PAYMOB_CARD_IFRAME_ID}
paymob.tabby.integration-id=${PAYMOB_TABBY_INTEGRATION_ID}
paymob.tamara.integration-id=${PAYMOB_TAMARA_INTEGRATION_ID}

# -----------------------------
# Twilio SendGrid (email)
# -----------------------------
twilio.sendgrid.api-key=${SENDGRID_API_KEY}
twilio.sendgrid.from-email=${SENDGRID_FROM_EMAIL:firdovsirz@gmail.com}
twilio.sendgrid.from-name=Buyology

# -----------------------------
# OTP settings
# -----------------------------
otp.expiry-minutes=10
otp.resend-cooldown-seconds=60

# -----------------------------
# Multipart file upload
# -----------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=100MB

# -----------------------------
# Courier service proxy
# -----------------------------
courier.service.url=${COURIER_SERVICE_URL:https://api-courier.dithari.com}
courier.service.timeout-ms=${COURIER_SERVICE_TIMEOUT_MS:5000}
courier.service.jwt.private-key=${COURIER_SERVICE_PRIVATE_KEY}
courier.service.jwt.issuer=buyology-ecommerce-service
courier.service.jwt.expiry-seconds=${COURIER_SERVICE_JWT_EXPIRY:60}

# -----------------------------
# Swagger UI
# -----------------------------
springdoc.swagger-ui.path=/swagger-ui.html

# -----------------------------
# Contabo S3 (Object Storage)
# -----------------------------
contabo.s3.endpoint=${CONTABO_S3_ENDPOINT}
contabo.s3.access-key=${CONTABO_S3_ACCESS_KEY}
contabo.s3.secret-key=${CONTABO_S3_SECRET_KEY}
contabo.s3.bucket-name=${CONTABO_S3_BUCKET_NAME}
contabo.s3.public-url=${CONTABO_S3_PUBLIC_URL}

# -----------------------------
# Elasticsearch
# -----------------------------
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}

# -----------------------------
# Firebase / FCM push notifications
# -----------------------------
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_KEY:}
