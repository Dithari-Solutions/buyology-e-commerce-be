<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order update</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f4fb;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f4fb;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(64,47,117,0.08);">

<tr>
<td style="background-color:#402F75;padding:26px 32px;">
<span style="color:#FBBB14;font-size:24px;font-weight:bold;letter-spacing:1px;">BUYOLOGY</span>
</td>
</tr>

<tr>
<td align="center" style="padding:30px 32px 0;">
<span style="display:inline-block;background-color:{{STATUS_COLOR}};color:#ffffff;font-size:12px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;padding:7px 16px;border-radius:30px;">{{STATUS_BADGE}}</span>
</td>
</tr>

<tr>
<td style="padding:18px 32px 8px;text-align:center;">
<h1 style="margin:0 0 8px;color:#402F75;font-size:22px;">{{STATUS_TITLE}}</h1>
<p style="margin:0;color:#555;font-size:15px;line-height:1.6;">Hi {{RECIPIENT_NAME}}, {{STATUS_MESSAGE}}</p>
<p style="margin:14px 0 0;color:#888;font-size:13px;">Order <strong>{{ORDER_NUMBER}}</strong></p>
</td>
</tr>

<tr>
<td align="center" style="padding:24px 32px 8px;">
<a href="{{ORDER_URL}}" style="display:inline-block;background-color:#FBBB14;color:#402F75;text-decoration:none;font-size:15px;font-weight:bold;padding:14px 34px;border-radius:30px;">View order</a>
</td>
</tr>

<tr>
<td style="padding:18px 32px 30px;">
<p style="margin:0;color:#999;font-size:12px;line-height:1.6;text-align:center;">
Buyology FZ Trading LLC &middot; United Arab Emirates<br />
Need help? <a href="mailto:support@buyology.com" style="color:#402F75;">support@buyology.com</a>
</p>
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
