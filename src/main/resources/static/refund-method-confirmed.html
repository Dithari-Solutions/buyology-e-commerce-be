<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refund Return Method Confirmed</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:#402F75;padding:32px 40px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:24px;letter-spacing:1px;">Buyology</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <h2 style="color:#402F75;margin:0 0 16px;">Return method confirmed</h2>
              <p style="color:#333;font-size:15px;line-height:1.6;margin:0 0 12px;">
                Hi <strong>{{CUSTOMER_NAME}}</strong>,
              </p>
              <p style="color:#333;font-size:15px;line-height:1.6;margin:0 0 12px;">
                You've chosen <strong>{{METHOD}}</strong> for refund request <strong>{{REQUEST_ID}}</strong> on order <strong>{{ORDER_NUMBER}}</strong>.
              </p>
              <div style="background:#f0edf9;border-left:4px solid #402F75;padding:16px 20px;border-radius:4px;margin:16px 0 24px;">
                <p style="margin:0;color:#402F75;font-size:14px;">{{INSTRUCTIONS}}</p>
              </div>
              <p style="color:#555;font-size:14px;line-height:1.6;margin:0;">
                We'll send another email once we receive and inspect the product.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#f9f9f9;padding:20px 40px;text-align:center;border-top:1px solid #eeeeee;">
              <p style="color:#999;font-size:12px;margin:0;">© Buyology. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
