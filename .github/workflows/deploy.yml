name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /opt/buyology-ecommerce-be

jobs:

  # ── Job 1: Build JAR, build & push Docker image ────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to VPS via Docker Compose ────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}
          PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
          PAYMOB_SECRET_KEY: ${{ secrets.PAYMOB_SECRET_KEY }}
          PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
          PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
          PAYMOB_NOTIFICATION_URL: ${{ secrets.PAYMOB_NOTIFICATION_URL }}
          PAYMOB_REDIRECTION_URL: ${{ secrets.PAYMOB_REDIRECTION_URL }}
          PAYMOB_CARD_INTEGRATION_ID: ${{ secrets.PAYMOB_CARD_INTEGRATION_ID }}
          PAYMOB_CARD_IFRAME_ID: ${{ secrets.PAYMOB_CARD_IFRAME_ID }}
          PAYMOB_TABBY_INTEGRATION_ID: ${{ secrets.PAYMOB_TABBY_INTEGRATION_ID }}
          PAYMOB_TAMARA_INTEGRATION_ID: ${{ secrets.PAYMOB_TAMARA_INTEGRATION_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          COURIER_SERVICE_PRIVATE_KEY: ${{ secrets.COURIER_SERVICE_PRIVATE_KEY }}
          CONTABO_S3_ENDPOINT: ${{ secrets.CONTABO_S3_ENDPOINT }}
          CONTABO_S3_ACCESS_KEY: ${{ secrets.CONTABO_S3_ACCESS_KEY }}
          CONTABO_S3_SECRET_KEY: ${{ secrets.CONTABO_S3_SECRET_KEY }}
          CONTABO_S3_BUCKET_NAME: ${{ secrets.CONTABO_S3_BUCKET_NAME }}
          CONTABO_S3_PUBLIC_URL: ${{ secrets.CONTABO_S3_PUBLIC_URL }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_TAG,DOCKER_USERNAME,DOCKER_PASSWORD,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,SENDGRID_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,APPLE_TEAM_ID,APPLE_CLIENT_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_REDIRECT_URI,PAYMOB_API_KEY,PAYMOB_SECRET_KEY,PAYMOB_PUBLIC_KEY,PAYMOB_HMAC_SECRET,PAYMOB_NOTIFICATION_URL,PAYMOB_REDIRECTION_URL,PAYMOB_CARD_INTEGRATION_ID,PAYMOB_CARD_IFRAME_ID,PAYMOB_TABBY_INTEGRATION_ID,PAYMOB_TAMARA_INTEGRATION_ID,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,FIREBASE_SERVICE_ACCOUNT_KEY,COURIER_SERVICE_PRIVATE_KEY,CONTABO_S3_ENDPOINT,CONTABO_S3_ACCESS_KEY,CONTABO_S3_SECRET_KEY,CONTABO_S3_BUCKET_NAME,CONTABO_S3_PUBLIC_URL,RABBITMQ_USERNAME,RABBITMQ_PASSWORD
          script: |
            set -euo pipefail
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # ── Docker daemon log rotation (idempotent) ────────────────────────
            if [ ! -f /etc/docker/daemon.json ] || ! grep -q '"max-size"' /etc/docker/daemon.json 2>/dev/null; then
              mkdir -p /etc/docker
              printf '{\n  "log-driver": "json-file",\n  "log-opts": { "max-size": "50m", "max-file": "3" }\n}\n' > /etc/docker/daemon.json
              systemctl reload docker || true
            fi

            # ── Firebase service-account JSON (base64-encoded secret) ──────────
            mkdir -p /opt/buyology/firebase
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_KEY}" | base64 -d > /opt/buyology/firebase/service-account.json

            # ── Write .env from shell env vars ────────────────────────────────
            # APPLE_PRIVATE_KEY and COURIER_SERVICE_PRIVATE_KEY are excluded —
            # both are multi-line PEM keys that break .env file parsing.
            # They are already exported in the shell environment via envs above
            # and Docker Compose reads them from there directly.
            cat > .env.tmp << ENVEOF
            DOCKER_USERNAME=${DOCKER_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            SENDGRID_API_KEY=${SENDGRID_API_KEY}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
            APPLE_TEAM_ID=${APPLE_TEAM_ID}
            APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
            APPLE_KEY_ID=${APPLE_KEY_ID}
            APPLE_REDIRECT_URI=${APPLE_REDIRECT_URI}
            REDIS_HOST=redis
            REDIS_PORT=6379
            PAYMOB_API_KEY=${PAYMOB_API_KEY}
            PAYMOB_SECRET_KEY=${PAYMOB_SECRET_KEY}
            PAYMOB_PUBLIC_KEY=${PAYMOB_PUBLIC_KEY}
            PAYMOB_HMAC_SECRET=${PAYMOB_HMAC_SECRET}
            PAYMOB_NOTIFICATION_URL=${PAYMOB_NOTIFICATION_URL}
            PAYMOB_REDIRECTION_URL=${PAYMOB_REDIRECTION_URL}
            PAYMOB_BASE_URL=https://uae.paymob.com
            PAYMOB_CARD_INTEGRATION_ID=${PAYMOB_CARD_INTEGRATION_ID}
            PAYMOB_CARD_IFRAME_ID=${PAYMOB_CARD_IFRAME_ID}
            PAYMOB_TABBY_INTEGRATION_ID=${PAYMOB_TABBY_INTEGRATION_ID}
            PAYMOB_TAMARA_INTEGRATION_ID=${PAYMOB_TAMARA_INTEGRATION_ID}
            TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
            TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
            TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
            CONTABO_S3_ENDPOINT=${CONTABO_S3_ENDPOINT}
            CONTABO_S3_ACCESS_KEY=${CONTABO_S3_ACCESS_KEY}
            CONTABO_S3_SECRET_KEY=${CONTABO_S3_SECRET_KEY}
            CONTABO_S3_BUCKET_NAME=${CONTABO_S3_BUCKET_NAME}
            CONTABO_S3_PUBLIC_URL=${CONTABO_S3_PUBLIC_URL}
            RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
            RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            ENVEOF
            mv .env.tmp .env
            chmod 600 .env

            # ── Ensure courier network exists (guard for fresh server) ─────────
            docker network create buyology-e-commerce-courier-be_default 2>/dev/null || true

            # ── Login and pull new image ───────────────────────────────────────
            printf '%s' "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
            docker compose pull app

            # ── Tear down and bring up fresh ──────────────────────────────────
            docker compose down --remove-orphans || true
            docker compose up -d

            # ── Readiness probe (max 120s) ─────────────────────────────────────
            echo "Waiting for app readiness..."
            for i in $(seq 1 24); do
              HTTP=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health/readiness 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "  Deploy successful — readiness probe returned 200."
                break
              fi
              if [ "$i" = "24" ]; then
                echo "ERROR: App did not become ready in 120s (last HTTP: $HTTP)."
                docker compose logs --tail=80 app
                exit 1
              fi
              echo "  attempt $i/24: HTTP $HTTP"
              sleep 5
            done

            # ── Clean up dangling images ───────────────────────────────────────
            docker image prune -f --filter "until=24h" || true

            echo "=== Running containers ==="
            docker compose ps
