name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
      PAYMOB_SECRET_KEY: ${{ secrets.PAYMOB_SECRET_KEY }}
      PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
      PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
      PAYMOB_CARD_INTEGRATION_ID: ${{ secrets.PAYMOB_CARD_INTEGRATION_ID }}
      PAYMOB_CARD_IFRAME_ID: ${{ secrets.PAYMOB_CARD_IFRAME_ID }}
      PAYMOB_TABBY_INTEGRATION_ID: ${{ secrets.PAYMOB_TABBY_INTEGRATION_ID }}
      PAYMOB_TAMARA_INTEGRATION_ID: ${{ secrets.PAYMOB_TAMARA_INTEGRATION_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      COURIER_SERVICE_PRIVATE_KEY: ${{ secrets.COURIER_SERVICE_PRIVATE_KEY }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,SENDGRID_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,REDIS_HOST,REDIS_PORT,DOCKER_USERNAME,PAYMOB_API_KEY,PAYMOB_SECRET_KEY,PAYMOB_PUBLIC_KEY,PAYMOB_HMAC_SECRET,PAYMOB_CARD_INTEGRATION_ID,PAYMOB_CARD_IFRAME_ID,PAYMOB_TABBY_INTEGRATION_ID,PAYMOB_TAMARA_INTEGRATION_ID,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,COURIER_SERVICE_PRIVATE_KEY
          script: |
            docker pull "$DOCKER_USERNAME/ecommerce-app:latest"

            docker stop ecommerce-app || true
            docker rm ecommerce-app || true

            # COURIER_SERVICE_PRIVATE_KEY secret must already be base64-encoded PEM
            # (run: base64 -w 0 courier-private.pem and store the output as the secret)
            docker run -d \
              --name ecommerce-app \
              -p 8080:8080 \
              --restart always \
              --network ecommerce-network \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e "SPRING_DATASOURCE_URL=$DB_URL" \
              -e "SPRING_DATASOURCE_USERNAME=$DB_USERNAME" \
              -e "SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD" \
              -e "JWT_SECRET=$JWT_SECRET" \
              -e "SENDGRID_API_KEY=$SENDGRID_API_KEY" \
              -e "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
              -e "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
              -e "GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI" \
              -e "REDIS_HOST=$REDIS_HOST" \
              -e "REDIS_PORT=$REDIS_PORT" \
              -e COOKIE_SECURE=true \
              -e "PAYMOB_API_KEY=$PAYMOB_API_KEY" \
              -e "PAYMOB_SECRET_KEY=$PAYMOB_SECRET_KEY" \
              -e "PAYMOB_PUBLIC_KEY=$PAYMOB_PUBLIC_KEY" \
              -e "PAYMOB_HMAC_SECRET=$PAYMOB_HMAC_SECRET" \
              -e "PAYMOB_BASE_URL=https://uae.paymob.com" \
              -e "PAYMOB_CARD_INTEGRATION_ID=$PAYMOB_CARD_INTEGRATION_ID" \
              -e "PAYMOB_CARD_IFRAME_ID=$PAYMOB_CARD_IFRAME_ID" \
              -e "PAYMOB_TABBY_INTEGRATION_ID=$PAYMOB_TABBY_INTEGRATION_ID" \
              -e "PAYMOB_TAMARA_INTEGRATION_ID=$PAYMOB_TAMARA_INTEGRATION_ID" \
              -e "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID" \
              -e "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN" \
              -e "TWILIO_PHONE_NUMBER=+1your_twilio_number" \
              -e "COURIER_SERVICE_PRIVATE_KEY=$COURIER_SERVICE_PRIVATE_KEY" \
              "$DOCKER_USERNAME/ecommerce-app:latest"
