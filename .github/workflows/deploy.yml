name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEPLOY_PATH: /opt/buyology-ecommerce-be

jobs:

  # ── Job 0: Run unit + Testcontainers integration tests ─────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit + integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./mvnw -B test -Dtest='*Test,*IT' -DfailIfNoTests=false

  # ── Job 1: Build JAR, build & push Docker image (once) ─────────────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Rolling deploy to BOTH app servers over WireGuard ───────────────
  # max-parallel: 1 → deploy one replica at a time. While one is restarting,
  # HAProxy keeps serving from the other → zero downtime. It also prevents both
  # nodes racing on Hibernate ddl-auto during a first-time empty-DB boot.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: web-app-1
            host_secret: VPS_HOST_1
            wg_bind: "10.10.0.2"
          - name: web-app-2
            host_secret: VPS_HOST_2
            wg_bind: "10.10.0.3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy app compose to ${{ matrix.name }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.app.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy via SSH to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          WG_BIND_IP: ${{ matrix.wg_bind }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          # ── Datastores (credentials only — hosts/db-name are baked into the compose) ──
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          # ── Schema / first-boot (repo VARIABLES, flip for empty-DB bootstrap) ──
          HIBERNATE_DDL_AUTO: ${{ vars.HIBERNATE_DDL_AUTO || 'validate' }}
          MFA_ENABLED: ${{ vars.MFA_ENABLED || 'false' }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          # ── Security ──
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_SECRET_ENCRYPTION_KEY: ${{ secrets.MFA_SECRET_ENCRYPTION_KEY }}
          # ── App config ──
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          RATE_LIMIT_BYPASS_KEY: ${{ secrets.RATE_LIMIT_BYPASS_KEY }}
          TRUST_FORWARDED_HEADERS: ${{ vars.TRUST_FORWARDED_HEADERS || 'false' }}
          # ── Email ──
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          # ── OAuth ──
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}
          # ── Paymob ──
          PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
          PAYMOB_SECRET_KEY: ${{ secrets.PAYMOB_SECRET_KEY }}
          PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
          PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
          PAYMOB_NOTIFICATION_URL: ${{ secrets.PAYMOB_NOTIFICATION_URL }}
          PAYMOB_REDIRECTION_URL: ${{ secrets.PAYMOB_REDIRECTION_URL }}
          PAYMOB_CARD_INTEGRATION_ID: ${{ secrets.PAYMOB_CARD_INTEGRATION_ID }}
          PAYMOB_CARD_IFRAME_ID: ${{ secrets.PAYMOB_CARD_IFRAME_ID }}
          PAYMOB_TABBY_INTEGRATION_ID: ${{ secrets.PAYMOB_TABBY_INTEGRATION_ID }}
          PAYMOB_TAMARA_INTEGRATION_ID: ${{ secrets.PAYMOB_TAMARA_INTEGRATION_ID }}
          # ── Quiqup (STAGING delivery test module; inert unless QUIQUP_ENABLED=true) ──
          QUIQUP_ENABLED: ${{ vars.QUIQUP_ENABLED || 'false' }}
          QUIQUP_BASE_URL: ${{ vars.QUIQUP_BASE_URL }}
          QUIQUP_AUTH_MODE: ${{ vars.QUIQUP_AUTH_MODE }}
          QUIQUP_API_KEY: ${{ secrets.QUIQUP_API_KEY }}
          QUIQUP_API_KEY_HEADER: ${{ vars.QUIQUP_API_KEY_HEADER }}
          QUIQUP_API_KEY_PREFIX: ${{ vars.QUIQUP_API_KEY_PREFIX }}
          QUIQUP_ACCOUNT_ID: ${{ secrets.QUIQUP_ACCOUNT_ID }}
          QUIQUP_WEBHOOK_SECRET: ${{ secrets.QUIQUP_WEBHOOK_SECRET }}
          QUIQUP_WEBHOOK_TOKEN: ${{ secrets.QUIQUP_WEBHOOK_TOKEN }}
          QUIQUP_WEBHOOK_TOKEN_HEADER: ${{ vars.QUIQUP_WEBHOOK_TOKEN_HEADER }}
          QUIQUP_ALLOW_PRODUCTION_WRITES: ${{ vars.QUIQUP_ALLOW_PRODUCTION_WRITES || 'false' }}
          QUIQUP_TIMEOUT_MS: ${{ vars.QUIQUP_TIMEOUT_MS || '20000' }}
          QUIQUP_CONNECT_TIMEOUT_MS: ${{ vars.QUIQUP_CONNECT_TIMEOUT_MS || '5000' }}
          # ── ERPNext (Frappe) integration (TESTING; read-only, inert unless ERPNEXT_ENABLED=true) ──
          ERPNEXT_ENABLED: ${{ vars.ERPNEXT_ENABLED || 'false' }}
          ERPNEXT_BASE_URL: ${{ vars.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          # Order push (PAID order → ERPNext Sales Order + Sales Invoice)
          ERPNEXT_SYNC_ORDERS: ${{ vars.ERPNEXT_SYNC_ORDERS || 'true' }}
          ERPNEXT_SUBMIT_DOCUMENTS: ${{ vars.ERPNEXT_SUBMIT_DOCUMENTS || 'true' }}
          ERPNEXT_COMPANY: ${{ vars.ERPNEXT_COMPANY }}
          ERPNEXT_AUTO_CREATE_CUSTOMER: ${{ vars.ERPNEXT_AUTO_CREATE_CUSTOMER || 'true' }}
          ERPNEXT_AUTO_CREATE_ITEMS: ${{ vars.ERPNEXT_AUTO_CREATE_ITEMS || 'true' }}
          ERPNEXT_DEFAULT_ITEM_GROUP: ${{ vars.ERPNEXT_DEFAULT_ITEM_GROUP }}
          ERPNEXT_DEFAULT_UOM: ${{ vars.ERPNEXT_DEFAULT_UOM }}
          ERPNEXT_CUSTOMER_GROUP: ${{ vars.ERPNEXT_CUSTOMER_GROUP }}
          ERPNEXT_TERRITORY: ${{ vars.ERPNEXT_TERRITORY }}
          ERPNEXT_SHIPPING_ACCOUNT_HEAD: ${{ vars.ERPNEXT_SHIPPING_ACCOUNT_HEAD }}
          ERPNEXT_DEFAULT_WAREHOUSE: ${{ vars.ERPNEXT_DEFAULT_WAREHOUSE }}
          # ── Claude API (AI repair price estimate + sell/trade-in valuation) ──
          # Without ANTHROPIC_API_KEY both estimates ship disabled and the flows fall
          # back to manual pricing, so an unset secret looks like a bug rather than a
          # config gap — set it before enabling the repair/sell pages.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REPAIR_AI_ESTIMATE_ENABLED: ${{ vars.REPAIR_AI_ESTIMATE_ENABLED || 'true' }}
          REPAIR_PRICING_PATH: ${{ vars.REPAIR_PRICING_PATH }}
          SELL_AI_ESTIMATE_ENABLED: ${{ vars.SELL_AI_ESTIMATE_ENABLED || 'true' }}
          SELL_PRICING_PATH: ${{ vars.SELL_PRICING_PATH }}
          # ── Website visitor analytics ──
          # ANALYTICS_ENABLED is the kill switch on the storefront page-view beacon, the only
          # unauthenticated write endpoint; it must be flippable from repo vars, not a code deploy.
          # Every var is optional — docker-compose.app.yml supplies the same defaults, so an unset
          # or empty value here still boots.
          ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'true' }}
          ANALYTICS_RETENTION_DAYS: ${{ vars.ANALYTICS_RETENTION_DAYS || '400' }}
          ANALYTICS_IP_SALT: ${{ secrets.ANALYTICS_IP_SALT }}
          # ── Twilio ──
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          # ── Storage / push ──
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          COURIER_SERVICE_PRIVATE_KEY: ${{ secrets.COURIER_SERVICE_PRIVATE_KEY }}
          CONTABO_S3_ENDPOINT: ${{ secrets.CONTABO_S3_ENDPOINT }}
          CONTABO_S3_ACCESS_KEY: ${{ secrets.CONTABO_S3_ACCESS_KEY }}
          CONTABO_S3_SECRET_KEY: ${{ secrets.CONTABO_S3_SECRET_KEY }}
          CONTABO_S3_BUCKET_NAME: ${{ secrets.CONTABO_S3_BUCKET_NAME }}
          CONTABO_S3_PUBLIC_URL: ${{ secrets.CONTABO_S3_PUBLIC_URL }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_TAG,WG_BIND_IP,DOCKER_USERNAME,DOCKER_PASSWORD,DB_USERNAME,DB_PASSWORD,REDIS_PASSWORD,RABBITMQ_USERNAME,RABBITMQ_PASSWORD,HIBERNATE_DDL_AUTO,MFA_ENABLED,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_PASSWORD,JWT_SECRET,MFA_SECRET_ENCRYPTION_KEY,CORS_ALLOWED_ORIGINS,WEB_BASE_URL,RATE_LIMIT_BYPASS_KEY,TRUST_FORWARDED_HEADERS,SENDGRID_API_KEY,SENDGRID_FROM_EMAIL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,APPLE_TEAM_ID,APPLE_CLIENT_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_REDIRECT_URI,PAYMOB_API_KEY,PAYMOB_SECRET_KEY,PAYMOB_PUBLIC_KEY,PAYMOB_HMAC_SECRET,PAYMOB_NOTIFICATION_URL,PAYMOB_REDIRECTION_URL,PAYMOB_CARD_INTEGRATION_ID,PAYMOB_CARD_IFRAME_ID,PAYMOB_TABBY_INTEGRATION_ID,PAYMOB_TAMARA_INTEGRATION_ID,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,TWILIO_VERIFY_SERVICE_SID,FIREBASE_SERVICE_ACCOUNT_KEY,COURIER_SERVICE_PRIVATE_KEY,CONTABO_S3_ENDPOINT,CONTABO_S3_ACCESS_KEY,CONTABO_S3_SECRET_KEY,CONTABO_S3_BUCKET_NAME,CONTABO_S3_PUBLIC_URL,QUIQUP_ENABLED,QUIQUP_BASE_URL,QUIQUP_AUTH_MODE,QUIQUP_API_KEY,QUIQUP_API_KEY_HEADER,QUIQUP_API_KEY_PREFIX,QUIQUP_ACCOUNT_ID,QUIQUP_WEBHOOK_SECRET,QUIQUP_WEBHOOK_TOKEN,QUIQUP_WEBHOOK_TOKEN_HEADER,QUIQUP_ALLOW_PRODUCTION_WRITES,QUIQUP_TIMEOUT_MS,QUIQUP_CONNECT_TIMEOUT_MS,ERPNEXT_ENABLED,ERPNEXT_BASE_URL,ERPNEXT_API_KEY,ERPNEXT_API_SECRET,ERPNEXT_SYNC_ORDERS,ERPNEXT_SUBMIT_DOCUMENTS,ERPNEXT_COMPANY,ERPNEXT_AUTO_CREATE_CUSTOMER,ERPNEXT_AUTO_CREATE_ITEMS,ERPNEXT_DEFAULT_ITEM_GROUP,ERPNEXT_DEFAULT_UOM,ERPNEXT_CUSTOMER_GROUP,ERPNEXT_TERRITORY,ERPNEXT_SHIPPING_ACCOUNT_HEAD,ERPNEXT_DEFAULT_WAREHOUSE,ANTHROPIC_API_KEY,ANTHROPIC_MODEL,REPAIR_AI_ESTIMATE_ENABLED,REPAIR_PRICING_PATH,SELL_AI_ESTIMATE_ENABLED,SELL_PRICING_PATH,ANALYTICS_ENABLED,ANALYTICS_RETENTION_DAYS,ANALYTICS_IP_SALT
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}

            # ── Firebase service-account JSON (base64-encoded secret) ──────────
            # Dir is pre-created and owned by the deploy user during host setup.
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_KEY}" | base64 -d > /opt/buyology/firebase/service-account.json

            # ── Export secrets so compose ${VAR} substitution picks them up ────
            export DOCKER_USERNAME IMAGE_TAG WG_BIND_IP DB_USERNAME DB_PASSWORD \
                   REDIS_PASSWORD RABBITMQ_USERNAME RABBITMQ_PASSWORD \
                   HIBERNATE_DDL_AUTO MFA_ENABLED BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_PASSWORD \
                   JWT_SECRET MFA_SECRET_ENCRYPTION_KEY CORS_ALLOWED_ORIGINS WEB_BASE_URL \
                   RATE_LIMIT_BYPASS_KEY TRUST_FORWARDED_HEADERS \
                   SENDGRID_API_KEY SENDGRID_FROM_EMAIL \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
                   APPLE_TEAM_ID APPLE_CLIENT_ID APPLE_KEY_ID APPLE_PRIVATE_KEY APPLE_REDIRECT_URI \
                   PAYMOB_API_KEY PAYMOB_SECRET_KEY PAYMOB_PUBLIC_KEY PAYMOB_HMAC_SECRET \
                   PAYMOB_NOTIFICATION_URL PAYMOB_REDIRECTION_URL \
                   PAYMOB_CARD_INTEGRATION_ID PAYMOB_CARD_IFRAME_ID \
                   PAYMOB_TABBY_INTEGRATION_ID PAYMOB_TAMARA_INTEGRATION_ID \
                   TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_PHONE_NUMBER TWILIO_VERIFY_SERVICE_SID \
                   COURIER_SERVICE_PRIVATE_KEY \
                   CONTABO_S3_ENDPOINT CONTABO_S3_ACCESS_KEY CONTABO_S3_SECRET_KEY \
                   CONTABO_S3_BUCKET_NAME CONTABO_S3_PUBLIC_URL \
                   QUIQUP_ENABLED QUIQUP_BASE_URL QUIQUP_AUTH_MODE QUIQUP_API_KEY \
                   QUIQUP_API_KEY_HEADER QUIQUP_API_KEY_PREFIX QUIQUP_ACCOUNT_ID QUIQUP_WEBHOOK_SECRET \
                   QUIQUP_WEBHOOK_TOKEN QUIQUP_WEBHOOK_TOKEN_HEADER \
                   QUIQUP_ALLOW_PRODUCTION_WRITES QUIQUP_TIMEOUT_MS QUIQUP_CONNECT_TIMEOUT_MS \
                   ERPNEXT_ENABLED ERPNEXT_BASE_URL ERPNEXT_API_KEY ERPNEXT_API_SECRET \
                   ERPNEXT_SYNC_ORDERS ERPNEXT_SUBMIT_DOCUMENTS ERPNEXT_COMPANY \
                   ERPNEXT_AUTO_CREATE_CUSTOMER ERPNEXT_AUTO_CREATE_ITEMS \
                   ERPNEXT_DEFAULT_ITEM_GROUP ERPNEXT_DEFAULT_UOM \
                   ERPNEXT_CUSTOMER_GROUP ERPNEXT_TERRITORY ERPNEXT_SHIPPING_ACCOUNT_HEAD \
                   ERPNEXT_DEFAULT_WAREHOUSE \
                   ANTHROPIC_API_KEY ANTHROPIC_MODEL \
                   REPAIR_AI_ESTIMATE_ENABLED REPAIR_PRICING_PATH \
                   SELL_AI_ESTIMATE_ENABLED SELL_PRICING_PATH \
                   ANALYTICS_ENABLED ANALYTICS_RETENTION_DAYS ANALYTICS_IP_SALT
            export PAYMOB_BASE_URL=https://uae.paymob.com
            rm -f .env

            # ── Login, pull, roll this replica ─────────────────────────────────
            printf '%s' "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
            docker compose -f docker-compose.app.yml pull app
            docker compose -f docker-compose.app.yml up -d

            # ── Readiness probe (max 150s) ─────────────────────────────────────
            sleep 40
            echo "Waiting for app readiness on ${{ matrix.name }}..."
            for i in $(seq 1 30); do
              # The app publishes 8080 on its WireGuard IP only (not localhost),
              # so probe that address — same endpoint HAProxy will health-check.
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://${WG_BIND_IP}:8080/actuator/health" || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "  ${{ matrix.name }} healthy (HTTP 200)."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: ${{ matrix.name }} not ready in 150s (last HTTP: $HTTP)."
                docker compose -f docker-compose.app.yml ps
                docker compose -f docker-compose.app.yml logs --tail=100 app
                exit 1
              fi
              echo "  attempt $i/30: HTTP $HTTP"
              sleep 5
            done

            docker image prune -f --filter "until=24h" || true
            docker compose -f docker-compose.app.yml ps
